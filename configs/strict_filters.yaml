rate_limits:
  min_core_remaining: 200
  min_search_remaining: 2
  min_code_search_remaining: 1
  min_graphql_remaining: 100

run_budget:
  max_repos_to_enrich: 25
  max_repos_for_activity: 25
  sleep_seconds_between_api_calls: 0.5
  stop_immediately_on_rate_limit: true

strict_filters:
  min_stars: 500
  main_pool_min_stars: 1000
  watchlist_min_stars: 500
  recent_commit_days: 7
  recent_merged_pr_days: 7
  recent_issue_or_pr_response_days: 14
  require_readme: true
  require_ci: true
  require_tests_or_test_command: true
  require_ai_agent_relevance: true
  reject_archived: true
  reject_forks: true
  unhealthy_open_pr_threshold: 100
  unhealthy_recent_merged_pr_threshold: 3

trending:
  use_trending_as_growth_signal: true
  periods:
    - daily
    - weekly
    - monthly
